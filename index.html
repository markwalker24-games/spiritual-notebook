<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spiritual Notebook</title>
<meta name="description" content="A private notebook for spiritual impressions, with four ink colors.">
<meta name="theme-color" content="#1F4D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notebook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one narrow column like a pocket notebook; fixed bottom toolbars; sheets slide up from the bottom. */
:root {
  --bg: #F4F5F2;
  --surface: #FFFFFF;
  --surface-2: #EEF0EC;
  --line: #DDE1DB;
  --fg: #1A1C1A;
  --muted: #55605A;
  --accent: #1F4D3A;
  --accent-soft: #E5EEE9;
  --on-accent: #FFFFFF;
  --star: #E0A526;
  --star-edge: #B7791F;
  --star-soft: #FFF4D6;
  --star-text: #8A5A0B;
  --danger: #B3261E;
  --ink-black: #1C1C1C;
  --ink-blue: #1F5FBF;
  --ink-red: #C0392B;
  --ink-green: #2E7D4F;
  --shadow: 0 6px 18px rgba(31, 77, 58, 0.28);
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --surface: #1C201D; --surface-2: #252A26; --line: #333A35;
    --fg: #ECEFEB; --muted: #A3ADA7; --accent: #7CC4A0; --accent-soft: #23392E; --on-accent: #0E1A14;
    --star: #E8B341; --star-edge: #E8B341; --star-soft: #3A3018; --star-text: #F0C866; --danger: #F2867D;
    --ink-black: #E9ECE8; --ink-blue: #84AEF2; --ink-red: #F2917F; --ink-green: #7FCB9A;
    --shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --surface: #1C201D; --surface-2: #252A26; --line: #333A35;
  --fg: #ECEFEB; --muted: #A3ADA7; --accent: #7CC4A0; --accent-soft: #23392E; --on-accent: #0E1A14;
  --star: #E8B341; --star-edge: #E8B341; --star-soft: #3A3018; --star-text: #F0C866; --danger: #F2867D;
  --ink-black: #E9ECE8; --ink-blue: #84AEF2; --ink-red: #F2917F; --ink-green: #7FCB9A;
  --shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { display: block; flex-shrink: 0; }

#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; min-height: 100%; display: flex; flex-direction: column; }

/* ---------- Home ---------- */
.top { padding-block: 20px 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.private { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-top: 4px; }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; padding: 0; color: var(--fg); }
.icon-btn.bare { border: none; background: transparent; }
.top-actions { display: flex; gap: 8px; }

.search { padding-block: 0 8px; }
.search input { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; background: var(--surface); }

.sunday { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-block: 2px 12px; display: flex; flex-direction: column; gap: 10px; }
.sun-head { display: flex; align-items: center; gap: 8px; }
.sun-label { flex: 1; font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
.sun-new { font-size: 11px; font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 6px; padding: 2px 7px; }
.sun-talk { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; }
a.sun-talk svg { color: var(--accent); }
.sun-tt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sun-title { font-size: 16px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.sun-speaker { font-size: 13px; color: var(--muted); }
.sun-note { margin: 0; font-size: 14px; line-height: 1.5; color: var(--fg); }
.sun-sub { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding-top: 2px; }
.sun-qs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.sun-qs li { display: flex; align-items: flex-start; gap: 10px; }
.sun-n { width: 24px; height: 24px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.sun-q { flex: 1; min-width: 0; font-size: 15px; line-height: 1.45; padding-top: 2px; }
.sun-write { flex-shrink: 0; min-height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; margin-top: -4px; }

.filters { display: flex; align-items: center; gap: 7px; padding-block: 2px 8px; flex-wrap: wrap; }
.chip { min-height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
.chip.on { border: 2px solid var(--fg); padding: 0 11px; }
.chip.star { color: var(--star-text); }
.chip.star.on { border-color: var(--star-edge); background: var(--star-soft); }
.chip.todo { color: var(--accent); }
.chip.todo.on { border-color: var(--accent); background: var(--accent-soft); }
.divider { width: 1px; height: 22px; background: var(--line); }
.dot-btn { width: 34px; height: 34px; border-radius: 17px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.dot-btn.on { border: 2px solid currentColor; }
.dot { width: 16px; height: 16px; border-radius: 8px; background: currentColor; }

.tagrow { display: flex; gap: 7px; overflow-x: auto; padding-block: 0 6px; scrollbar-width: none; }
.tagrow::-webkit-scrollbar { display: none; }
.tag { flex-shrink: 0; min-height: 32px; padding: 0 11px; border-radius: 8px; border: none; background: var(--surface-2); color: var(--muted); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.tag.on { background: var(--accent); color: var(--on-accent); }
.tag.small { min-height: 26px; padding: 0 8px; font-size: 12px; border-radius: 7px; }
.talk-chip { flex-shrink: 0; min-height: 26px; padding: 0 8px; border-radius: 7px; border: none; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; max-width: 100%; }
.talk-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.list { flex: 1; display: flex; flex-direction: column; gap: 6px; padding-block: 0 120px; }
.group { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; }
.group-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.month { background: var(--surface); border: none; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 8px; text-align: left; width: 100%; min-height: 52px; }
.month b { flex: 1; font-size: 15px; }
.month small { font-size: 13px; color: var(--muted); }

.card { background: var(--surface); border-radius: 14px; padding: 12px 16px 13px; display: flex; flex-direction: column; gap: 7px; cursor: pointer; }
.card-head { display: flex; align-items: center; gap: 8px; border: none; background: transparent; padding: 0; text-align: left; width: 100%; min-height: 24px; }
.card-head .when { flex: 1; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.card-lines { display: flex; flex-direction: column; gap: 4px; }
.cl { display: flex; align-items: flex-start; gap: 8px; border-radius: 6px; }
.cl.starred { background: var(--star-soft); padding: 2px 6px; margin-inline: -6px; }
.cl-text { flex: 1; min-width: 0; font-size: 15px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.cl.done .cl-text { text-decoration: line-through; opacity: 0.55; }
.more-lines { font-size: 13px; color: var(--muted); }
.card-foot { display: flex; flex-wrap: wrap; gap: 6px; }
.box { width: 26px; height: 26px; margin: -2px -4px -2px -5px; flex-shrink: 0; border: none; background: transparent; padding: 3px; display: flex; align-items: center; justify-content: center; }
.box i { width: 17px; height: 17px; border-radius: 4px; border: 2px solid currentColor; display: flex; align-items: center; justify-content: center; }
.box.done i { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.empty { padding: 48px 12px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty b { color: var(--fg); font-size: 16px; }

.fab { position: fixed; right: max(16px, calc(50% - 264px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); min-height: 52px; padding: 0 20px; border-radius: 26px; border: none; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; box-shadow: var(--shadow); }

/* ---------- Editor ---------- */
.ed-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--surface); display: flex; align-items: center; gap: 2px; padding-block: 6px; margin-inline: -16px; padding-inline: 4px 8px; }
.ed-bar .spacer { flex: 1; }
.text-btn { min-height: 44px; padding: 0 10px; border: none; background: transparent; display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 600; color: var(--accent); }
.text-btn.strong { font-weight: 700; }
.editor-page { background: var(--surface); }
.ed-head { display: flex; flex-direction: column; gap: 10px; padding-block: 6px 4px; }
.ed-date { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.ed-time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.add-btn { min-height: 32px; padding: 0 10px; border-radius: 8px; border: 1px dashed var(--line); background: transparent; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.tag.removable { background: var(--accent); color: var(--on-accent); padding-right: 8px; }

.lines { display: flex; flex-direction: column; padding-block: 12px 180px; }
.tap-zone { display: block; width: 100%; min-height: 200px; border: none; background: transparent; padding: 0; cursor: text; }
.tap-zone:focus-visible { outline-offset: -2px; }
.ln.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 40% { background: var(--accent-soft); } 100% { background: transparent; } }
.ln.starred.flash { animation: none; }

.list-intro { font-size: 13px; color: var(--muted); padding-top: 6px; }
.lrow { background: var(--surface); border-radius: 14px; padding: 6px 0 6px 16px; display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
.lrow .box { margin-top: 8px; }
.lrow-main { flex: 1; min-width: 0; border: none; background: transparent; padding: 7px 0; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.lrow-cap { font-size: 12px; font-weight: 600; color: var(--muted); overflow-wrap: anywhere; }
.lrow.done .cl-text { text-decoration: line-through; opacity: 0.55; }
.ln { display: flex; align-items: flex-start; gap: 2px; border-radius: 8px; margin-left: -8px; padding-left: 8px; }
.ln.starred { background: var(--star-soft); }
.ln textarea { flex: 1; min-width: 0; border: none; outline: none; resize: none; background: transparent; font-size: 17px; line-height: 1.55; padding: 9px 0; overflow: hidden; }
.ln textarea::placeholder { color: var(--muted); opacity: 0.7; }
.ln.done textarea { text-decoration: line-through; opacity: 0.55; }
.ln .lbox { width: 32px; height: 44px; flex-shrink: 0; border: none; background: transparent; padding: 0; display: flex; align-items: center; }
.ln .lbox i { width: 20px; height: 20px; border-radius: 5px; border: 2px solid currentColor; display: flex; align-items: center; justify-content: center; }
.ln.done .lbox i { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.ln .lstar { width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); opacity: 0.55; }
.ln.starred .lstar, .ln:focus-within .lstar { opacity: 1; }

.tools { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--surface-2); border-top: 1px solid var(--line); padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.tools-in { max-width: 528px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.tools-row { display: flex; gap: 8px; align-items: center; }
.tool-btn { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--accent); display: inline-flex; align-items: center; gap: 6px; }
.tool-btn.on { border: 2px solid var(--accent); background: var(--accent-soft); padding: 0 11px; }
.hint { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); }
.inks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.ink { min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 5px 0; font-size: 12px; font-weight: 600; }
.ink.on { border: 2px solid currentColor; }

/* While the keyboard is open: one compact row riding on top of it. */
.tools.kb { padding: 6px 10px; }
.tools.kb .tools-in { flex-direction: row; align-items: center; gap: 8px; }
.tools.kb .hint { display: none; }
.tools.kb .tool-btn { min-height: 40px; padding: 0 10px; }
.tools.kb .inks { flex: 1; display: flex; justify-content: space-around; gap: 4px; }
.tools.kb .ink { width: 44px; min-height: 40px; border-radius: 20px; padding: 0; }
.tools.kb .ink-name { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .tools { transition: transform 0.12s ease-out; } }

/* ---------- Sheets ---------- */
.scrim { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, 0.35); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 86%; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet-bar { display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--surface); padding-block: 4px; }
.sheet-bar h2 { margin: 0; font-size: 16px; }
.sec { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding-top: 6px; }
.opt { width: 100%; min-height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 10px 14px; display: flex; align-items: center; gap: 12px; text-align: left; }
.opt.on { border: 2px solid var(--accent); padding: 9px 13px; }
.opt .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.opt .txt b { font-size: 15px; font-weight: 600; }
.opt .txt small { font-size: 13px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input { min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; background: var(--bg); }
.row { display: flex; gap: 8px; }
.row input { flex: 1; min-width: 0; }
.primary { min-height: 44px; padding: 0 16px; border-radius: 12px; border: none; background: var(--accent); color: var(--on-accent); font-weight: 600; }
.secondary { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.danger { color: var(--danger); }
.tag-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-grid .tag { min-height: 38px; font-size: 14px; }
.note-p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }

/* ---------- Settings ---------- */
.set-page { display: flex; flex-direction: column; gap: 14px; padding-block: 0 40px; }
.panel { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; font-size: 16px; }
.trow { display: flex; align-items: center; gap: 8px; min-height: 40px; border-bottom: 1px solid var(--line); }
.trow:last-child { border-bottom: none; }
.trow span { flex: 1; font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; }

@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up 0.18s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}

</style>
</head>
<body>
<div id="app"></div><div id="sheet-root"></div><div id="toast" class="toast" role="status" hidden></div>
<script>
(function () {
  'use strict';

  // ---------- Storage (notes never leave this device) ----------
  var KEY = 'spiritual-notebook.v1';
  var INKS = ['black', 'blue', 'red', 'green'];
  var INK_NAME = { black: 'Black', blue: 'Blue', red: 'Red', green: 'Green' };
  var STARTER_TAGS = ['Prayer', 'Scripture', 'Family', 'Ministering', 'Temple'];

  function uid() {
    try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.notes)) {
          d.tags = Array.isArray(d.tags) ? d.tags : STARTER_TAGS.slice();
          d.recentTalks = Array.isArray(d.recentTalks) ? d.recentTalks : [];
          return d;
        }
      }
    } catch (e) {}
    return null;
  }
  var data = load();
  var firstRun = !data;
  if (!data) data = { v: 1, notes: [], tags: STARTER_TAGS.slice(), recentTalks: [] };
  var storageOk = true;
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); storageOk = true; }
    catch (e) { storageOk = false; }
  }
  var saveTimer = null;
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  if (firstRun) {
    var now = Date.now();
    data.notes.push({
      id: uid(), created: now, updated: now, star: false, tags: [], talk: null,
      lines: [
        { id: uid(), ink: 'black', text: 'Welcome. This note is an example. Delete it whenever you like.', star: false, todo: false, done: false },
        { id: uid(), ink: 'blue', text: 'Tap an ink color at the bottom to change the color of the line you are on, just like clicking the pen.', star: false, todo: false, done: false },
        { id: uid(), ink: 'red', text: 'Tap the star beside a line to remember to share it in quorum.', star: true, todo: false, done: false },
        { id: uid(), ink: 'green', text: 'Tap To-do to give a line a checkbox.', star: false, todo: true, done: false }
      ]
    });
    save();
  }

  // ---------- This week's talk (set by the presidency in talks.json) ----------
  var talksConfig = { thisWeek: null, conference: null };
  try {
    fetch('talks.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j) return;
        talksConfig = j;
        var h = sundayHash();
        if (h && data.seenSunday !== h) { ui.sundayNew = true; data.seenSunday = h; save(); }
        if (ui.view === 'home' || (ui.sheet && ui.sheet.type === 'talk')) render();
      })
      .catch(function () {});
  } catch (e) {}

  // ---------- UI state ----------
  var ui = {
    view: 'home', filter: null, query: '', searching: false,
    editId: null, focus: null, ink: 'black', todoMode: false,
    openMonths: {}, sheet: null, toast: null
  };

  // ---------- Helpers ----------
  function esc(s) {

  function byId(id) { for (var i = 0; i < data.notes.length; i++) if (data.notes[i].id === id) return data.notes[i]; return null; }
  function dayStart(t) { var d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }

  function fmtLong(t) { return new Date(t).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: new Date(t).getFullYear() === new Date().getFullYear() ? undefined : 'numeric' }); }

  function isBlank(n) { return !n.lines.some(function (l) { return l.text.trim(); }) && !n.tags.length && !n.talk && !n.star; }

  var ICON = {

    link: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>'

  // ---------- Filtering ----------
  function matches(n) {
    var f = ui.filter;
    if (f) {
      if (f.type === 'star' && !isStarred(n)) return false;
      if (f.type === 'todo' && !openTodos(n)) return false;
      if (f.type === 'ink' && !n.lines.some(function (l) { return l.ink === f.value && l.text.trim(); })) return false;
      if (f.type === 'tag' && n.tags.indexOf(f.value) < 0) return false;
      if (f.type === 'talk' && talkKey(n.talk) !== f.value) return false;
    }
    var q = ui.query.trim().toLowerCase();
    if (q) {
      var hay = n.lines.map(function (l) { return l.text; }).join(' ') + ' ' + n.tags.join(' ') + ' ' + (n.talk ? n.talk.title + ' ' + (n.talk.speaker || '') : '');
      if (hay.toLowerCase().indexOf(q) < 0) return false;

  function sameFilter(type, value) { return ui.filter && ui.filter.type === type && ui.filter.value === value; }
  function setFilter(type, value) { ui.filter = sameFilter(type, value) ? null : { type: type, value: value }; }

  // ---------- Home ----------
  function renderCard(n) {
    var shown = n.lines.filter(function (l) { return l.text.trim(); });
    var limit = 6;
    var body = shown.slice(0, limit).map(function (l) {
      var cls = 'cl' + (l.star ? ' starred' : '') + (l.todo && l.done ? ' done' : '');
      var box = l.todo ? '<button class="box' + (l.done ? ' done' : '') + '" style="color: var(--ink-' + l.ink + ')" data-act="card-check" data-id="' + n.id + '" data-line="' + l.id + '" aria-label="' + (l.done ? 'Mark not done' : 'Mark done') + '"><i>' + (l.done ? ICON.check : '') + '</i></button>' : '';
      return '<div class="' + cls + '">' + box + '<div class="cl-text" style="color: var(--ink-' + l.ink + ')">' + (l.star ? '★ ' : '') + esc(l.text) + '</div></div>';
    }).join('');
    if (shown.length > limit) body += '<div class="more-lines">+ ' + (shown.length - limit) + ' more lines</div>';
    var today = dayStart(Date.now());
    var when = dayStart(n.created) >= today - 86400000 ? fmtTime(n.created) : fmtDay(n.created) + ' · ' + fmtTime(n.created);
    var foot = '';
    if (n.talk) foot += '<button class="talk-chip" data-act="filter-talk" data-key="' + esc(talkKey(n.talk)) + '" aria-label="Show notes for this talk">' + ICON.book + '<span>' + esc(n.talk.title) + '</span></button>';
    n.tags.forEach(function (t) { foot += '<button class="tag small" data-act="filter-tag" data-tag="' + esc(t) + '">#' + esc(t) + '</button>'; });
    return '<div class="card" data-act="open" data-id="' + n.id + '">' +
      '<button class="card-head" data-act="open" data-id="' + n.id + '" aria-label="Open note from ' + esc(fmtLong(n.created)) + '"><span class="when">' + esc(when) + '</span>' + (isStarred(n) ? '<span style="color: var(--star-edge)">' + ICON.star(true, 16) + '</span>' : '') + '</button>' +
      '<div class="card-lines">' + (body || '<div class="cl-text" style="color: var(--muted)">Empty note</div>') + '</div>' +
      (foot ? '<div class="card-foot">' + foot + '</div>' : '') + '</div>';
  }

  function renderHome() {
    var notes = data.notes.slice().sort(function (a, b) { return b.created - a.created; });
    var starCount = starredLineCount();
    var todoCount = notes.reduce(function (a, n) { return a + openTodos(n); }, 0);
    var f = ui.filter;

    var h = '<header class="top"><div><h1>Spiritual Notebook</h1><div class="private">' + ICON.lock + 'Private · stays on this phone</div></div>' +
      '<div class="top-actions"><button class="icon-btn" data-act="search" aria-label="Search notes" aria-pressed="' + ui.searching + '">' + ICON.search + '</button>' +
      '<button class="icon-btn" data-act="settings" aria-label="Settings and backup">' + ICON.gear + '</button></div></header>';

    if (!ui.filter && !ui.query.trim()) h += renderSunday();

    if (ui.searching) h += '<div class="search"><label class="sr" for="q">Search notes</label><input id="q" type="search" placeholder="Search your notes" value="' + esc(ui.query) + '" autocomplete="off"></div>';

    h += '<div class="filters">' +
      '<button class="chip' + (!f ? ' on' : '') + '" data-act="filter-all">All</button>' +
      '<button class="chip star' + (f && f.type === 'star' ? ' on' : '') + '" data-act="filter-star" aria-label="Starred lines, ' + starCount + '">' + ICON.star(true, 15) + starCount + '</button>' +
      '<button class="chip todo' + (f && f.type === 'todo' ? ' on' : '') + '" data-act="filter-todo" aria-label="Open to-dos, ' + todoCount + '">' + ICON.todo + todoCount + '</button>' +
      '<span class="divider" aria-hidden="true"></span>' +
      INKS.map(function (k) {
        return '<button class="dot-btn' + (sameFilter('ink', k) ? ' on' : '') + '" style="color: var(--ink-' + k + ')" data-act="filter-ink" data-ink="' + k + '" aria-label="Lines in ' + INK_NAME[k] + ' ink"><span class="dot"></span></button>';
      }).join('') + '</div>';

    var usedTags = {};
    data.notes.forEach(function (n) { n.tags.forEach(function (t) { usedTags[t] = true; }); });
    var tagList = data.tags.filter(function (t) { return usedTags[t]; });
    if (tagList.length || (f && f.type === 'talk')) {
      h += '<div class="tagrow">';
      if (f && f.type === 'talk') {
        var tn = data.notes.filter(function (n) { return talkKey(n.talk) === f.value; })[0];
        h += '<button class="tag on" data-act="filter-all">' + ICON.book + esc(tn ? tn.talk.title : 'Talk') + ' ' + ICON.x + '</button>';
      }
      tagList.forEach(function (t) { h += '<button class="tag' + (sameFilter('tag', t) ? ' on' : '') + '" data-act="filter-tag" data-tag="' + esc(t) + '">#' + esc(t) + '</button>'; });
      h += '</div>';
    }

    if (f && (f.type === 'star' || f.type === 'todo' || f.type === 'ink')) {
      h += renderLineList(notes);
    } else {
    var shown = notes.filter(matches);
    var narrowing = !!(f || ui.query.trim());
    var today = dayStart(Date.now()), yesterday = today - 86400000;
    var curMonth = monthKey(Date.now());
    var groups = [], idx = {};
    shown.forEach(function (n) {
      var key, label, collapsible = false;
      if (n.created >= today) { key = 'today'; label = 'Today'; }
      else if (n.created >= yesterday) { key = 'yesterday'; label = 'Yesterday'; }
      else if (monthKey(n.created) === curMonth) { key = curMonth; label = 'Earlier in ' + new Date(n.created).toLocaleDateString([], { month: 'long' }); }
      else { key = monthKey(n.created); label = monthName(n.created); collapsible = true; }
      if (!idx[key]) { idx[key] = { key: key, label: label, collapsible: collapsible, notes: [] }; groups.push(idx[key]); }
      idx[key].notes.push(n);

    h += '<main class="list" aria-live="polite">';
    if (!shown.length) {
      h += narrowing
        ? '<div class="empty"><b>No notes match.</b><span>Try another filter or search word.</span></div>'

    }
    groups.forEach(function (g) {
      if (g.collapsible && !narrowing && !ui.openMonths[g.key]) {
        h += '<button class="month" data-act="month" data-key="' + g.key + '" aria-expanded="false"><b>' + esc(g.label) + '</b><small>' + g.notes.length + (g.notes.length === 1 ? ' note' : ' notes') + '</small>' + ICON.chev + '</button>';
        return;
      }
      h += '<section class="group"><div class="group-label">' + esc(g.label) +
        (g.collapsible && !narrowing ? ' <button class="text-btn" style="display:inline-flex; min-height:28px; font-size:12px; vertical-align:middle" data-act="month" data-key="' + g.key + '" aria-expanded="true">Hide</button>' : '') +
        '</div>' + g.notes.map(renderCard).join('') + '</section>';
    });
    h += '</main>';
    }
    h += '<button class="fab" data-act="new">' + ICON.pen + 'New note</button>';
    return h;
  }

  // ---------- This Sunday (posted by the presidency in talks.json) ----------
  function sunday() {
    var tw = (talksConfig && talksConfig.thisWeek) || {};
    var qs = Array.isArray(tw.questions) ? tw.questions.map(function (q) { return String(q || '').trim(); }).filter(Boolean) : [];
    var title = String(tw.title || '').trim(), note = String(tw.note || '').trim();
    if (!title && !qs.length && !note) return null;
    return { title: title, speaker: String(tw.speaker || '').trim(), date: String(tw.date || '').trim(),
      url: /^https:\/\//i.test(tw.url || '') ? tw.url : '', note: note, questions: qs };
  }
  function sundayHash() { var s = sunday(); return s ? JSON.stringify(s) : ''; }
  function renderSunday() {
    var s = sunday();
    if (!s) return '';
    var h = '<section class="sunday" aria-labelledby="sun-label"><div class="sun-head"><span id="sun-label" class="sun-label">This Sunday in quorum' + (s.date ? ' · ' + esc(s.date) : '') + '</span>' +
      (ui.sundayNew ? '<span class="sun-new">New</span>' : '') + '</div>';
    if (s.title) {
      var inner = '<span class="sun-title">' + esc(s.title) + '</span>' + (s.speaker ? '<span class="sun-speaker">' + esc(s.speaker) + '</span>' : '');
      h += s.url ? '<a class="sun-talk" href="' + esc(s.url) + '" target="_blank" rel="noopener"><span class="sun-tt">' + inner + '</span>' + ICON.link + '</a>' : '<div class="sun-talk"><span class="sun-tt">' + inner + '</span></div>';
    }
    if (s.note) h += '<p class="sun-note">' + esc(s.note) + '</p>';

      });
      h += '</ol>';
    }
    return h + '</section>';

  // Star, to-do and ink filters show the matching lines themselves, newest first.
  function lineMatches(n, l) {
    var f = ui.filter;
    if (!l.text.trim()) return false;
    if (f.type === 'star' && !(l.star || n.star)) return false;
    if (f.type === 'todo' && !(l.todo && !l.done)) return false;
    if (f.type === 'ink' && l.ink !== f.value) return false;
    var q = ui.query.trim().toLowerCase();
    if (q && l.text.toLowerCase().indexOf(q) < 0) return false;
    return true;
  }
  function starredLineCount() {
    return data.notes.reduce(function (a, n) {
      return a + n.lines.filter(function (l) { return l.text.trim() && (l.star || n.star); }).length;
    }, 0);
  }
  function renderLineList(notes) {
    var f = ui.filter;
    var today = dayStart(Date.now()), yesterday = today - 86400000, curMonth = monthKey(Date.now());
    var groups = [], idx = {}, total = 0;
    notes.forEach(function (n) {
      var ls = n.lines.filter(function (l) { return lineMatches(n, l); });
      if (!ls.length) return;
      var key, label;
      if (n.created >= today) { key = 'today'; label = 'Today'; }
      else if (n.created >= yesterday) { key = 'yesterday'; label = 'Yesterday'; }
      else if (monthKey(n.created) === curMonth) { key = curMonth; label = 'Earlier in ' + new Date(n.created).toLocaleDateString([], { month: 'long' }); }
      else { key = monthKey(n.created); label = monthName(n.created); }
      if (!idx[key]) { idx[key] = { label: label, rows: [] }; groups.push(idx[key]); }
      ls.forEach(function (l) { idx[key].rows.push({ n: n, l: l }); total++; });
    });
    var intro = f.type === 'star' ? 'Starred lines to share in quorum' : f.type === 'todo' ? 'Open to-dos' : 'Lines in ' + INK_NAME[f.value] + ' ink';
    var h = '<main class="list" aria-live="polite"><div class="list-intro">' + esc(intro) + ' · ' + total + '</div>';
    if (!total) {
      h += '<div class="empty"><b>' + (f.type === 'star' ? 'No starred lines yet.' : f.type === 'todo' ? 'No open to-dos.' : 'No lines in this ink.') + '</b><span>' +
        (f.type === 'star' ? 'Tap the star beside any line to collect it here.' : f.type === 'todo' ? 'Everything is checked off.' : 'Pick another ink or tap All.') + '</span></div>';
    }
    var today0 = dayStart(Date.now());
    groups.forEach(function (g) {
      h += '<section class="group"><div class="group-label">' + esc(g.label) + '</div>';
      g.rows.forEach(function (r) {
        var n = r.n, l = r.l;
        var when = dayStart(n.created) >= today0 - 86400000 ? fmtTime(n.created) : fmtDay(n.created);
        var cap = [when].concat(n.tags.map(function (t) { return '#' + t; })).concat(n.talk ? [n.talk.title] : []).join(' · ');
        var box = l.todo ? '<button class="box' + (l.done ? ' done' : '') + '" style="color: var(--ink-' + l.ink + ')" data-act="card-check" data-id="' + n.id + '" data-line="' + l.id + '" aria-label="' + (l.done ? 'Mark not done' : 'Mark done') + '"><i>' + (l.done ? ICON.check : '') + '</i></button>' : '';
        h += '<div class="lrow' + (l.todo && l.done ? ' done' : '') + '" data-act="open-line" data-id="' + n.id + '" data-line="' + l.id + '">' + box +
          '<button class="lrow-main" data-act="open-line" data-id="' + n.id + '" data-line="' + l.id + '" aria-label="Open this line in its note">' +
          '<span class="cl-text" style="color: var(--ink-' + l.ink + ')">' + esc(l.text) + '</span>' +
          '<span class="lrow-cap">' + esc(cap) + '</span></button>' +
          '<button class="lstar" style="opacity:1; color: ' + (l.star ? 'var(--star-edge)' : 'var(--muted)') + '" data-act="row-star" data-id="' + n.id + '" data-line="' + l.id + '" aria-pressed="' + l.star + '" aria-label="' + (l.star ? 'Unstar this line' : 'Star this line') + '">' + ICON.star(l.star, 18) + '</button></div>';
      });
      h += '</section>';
    });
    return h + '</main>';
  }

  // ---------- Editor ----------
  function curNote() { return byId(ui.editId); }
  function newLine(ink, todo) { return { id: uid(), ink: ink, text: '', star: false, todo: !!todo, done: false }; }

  function renderEditor() {
    var n = curNote();
    if (!n) { ui.view = 'home'; return renderHome(); }
    var h = '<div class="ed-bar"><button class="text-btn" data-act="close">' + ICON.back + 'Notebook</button><span class="spacer"></span>' +
      '<button class="icon-btn bare" data-act="note-star" aria-pressed="' + !!n.star + '" aria-label="' + (n.star ? 'Unstar this note' : 'Star this whole note') + '" style="color: ' + (n.star ? 'var(--star-edge)' : 'var(--muted)') + '">' + ICON.star(n.star, 22) + '</button>' +

      '<button class="text-btn strong" data-act="close">Done</button></div>';
    h += '<div class="ed-head"><div><div class="ed-date">' + esc(fmtLong(n.created)) + '</div><div class="ed-time">' + esc(fmtTime(n.created)) + '</div></div><div class="meta-row">';
    n.tags.forEach(function (t) { h += '<button class="tag removable" data-act="untag" data-tag="' + esc(t) + '" aria-label="Remove tag ' + esc(t) + '">#' + esc(t) + ICON.x + '</button>'; });
    h += '<button class="add-btn" data-act="sheet-tags">+ Tag</button>';
    if (n.talk) h += '<button class="talk-chip" style="min-height:32px; font-size:13px; padding:0 10px" data-act="sheet-talk">' + ICON.book + '<span>' + esc(n.talk.title) + '</span></button>';
    else h += '<button class="add-btn" data-act="sheet-talk">' + ICON.book + 'Talk</button>';
    h += '</div></div><div class="lines">';
    n.lines.forEach(function (l, i) {

  // ---------- Backup ----------
  function exportBackup() {
    var json = JSON.stringify(data, null, 2);
    var name = 'spiritual-notebook-' + new Date().toISOString().slice(0, 10) + '.json';
    var blob = new Blob([json], { type: 'application/json' });
    // Inside the Claude preview, files go through the viewer's own save dialog.
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then(function (dl) {
        if (!dl) { toast('Backups work once the app is on its own website'); return; }
        dl.save({ filename: name, data: json }).then(function () { toast('Backup saved'); }, function () {});
      });
      return;
    }
    try {
      var file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Spiritual Notebook backup' }).catch(function () {});
        return;
      }
    } catch (e) {}
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Backup saved');
  }
  function importBackup(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.notes)) throw new Error('bad');
        var have = {}; data.notes.forEach(function (n) { have[n.id] = n; });
        var added = 0;
        d.notes.forEach(function (n) {
          if (!n || !n.id || !Array.isArray(n.lines)) return;
          n.tags = Array.isArray(n.tags) ? n.tags : [];
          if (!have[n.id]) { data.notes.push(n); added++; }
          else if ((n.updated || 0) > (have[n.id].updated || 0)) { Object.assign(have[n.id], n); }
        });
        (d.tags || []).forEach(function (t) { if (data.tags.indexOf(t) < 0) data.tags.push(t); });
        data.notes.forEach(function (n) { n.tags.forEach(function (t) { if (data.tags.indexOf(t) < 0) data.tags.push(t); }); });
        save(); render();
        toast(added ? 'Restored ' + added + (added === 1 ? ' note' : ' notes') : 'Backup restored, nothing new to add');
      } catch (e) { toast('That file is not a Spiritual Notebook backup'); }
    };
    r.readAsText(file);
  }
  function toast(msg) {

  }
  function renderToast() {

    el.hidden = !ui.toast; el.textContent = ui.toast || '';
  }

  // ---------- Render ----------
  var app = document.getElementById('app');
  var sheetRoot = document.getElementById('sheet-root');
  function render() {

    app.innerHTML = ui.view === 'edit' ? renderEditor() : ui.view === 'settings' ? renderSettings() : renderHome();
    sheetRoot.innerHTML = renderSheet();
    if (ui.view === 'edit') {
      app.querySelectorAll('.ln textarea').forEach(autosize);
      if (ui.focus) focusLine(ui.focus.i, ui.focus.caret);
      placeTools();
      if (ui.highlight) {
        var hn = curNote(), hi = -1;
        hn.lines.forEach(function (l, i) { if (l.id === ui.highlight) hi = i; });
        var row = hi >= 0 && document.getElementById('ln' + hi);

  // ---------- Events ----------
  document.addEventListener('click', function (e) {

    var n = curNote();

      case 'search': ui.searching = !ui.searching; if (!ui.searching) ui.query = ''; render(); if (ui.searching) { var q = document.getElementById('q'); if (q) q.focus(); } break;
      case 'settings': ui.view = 'settings'; render(); window.scrollTo(0, 0); break;
      case 'home': ui.view = 'home'; render(); break;
      case 'filter-all': ui.filter = null; render(); break;
      case 'filter-star': setFilter('star', 1); render(); break;
      case 'filter-todo': setFilter('todo', 1); render(); break;
      case 'filter-ink': setFilter('ink', el.getAttribute('data-ink')); render(); break;
      case 'filter-tag': e.stopPropagation(); setFilter('tag', el.getAttribute('data-tag')); ui.view = 'home'; render(); break;
      case 'filter-talk': e.stopPropagation(); setFilter('talk', el.getAttribute('data-key')); render(); break;
      case 'month': var k = el.getAttribute('data-key'); ui.openMonths[k] = !ui.openMonths[k]; render(); break;
      case 'card-check': {

        break;
      }
      case 'open': openEditor(el.getAttribute('data-id')); break;
      case 'open-line': ui.highlight = el.getAttribute('data-line'); openEditor(el.getAttribute('data-id')); break;
      case 'row-star': {
        e.stopPropagation();

      }

      }

      case 'line-star': { var li = +el.getAttribute('data-i'); n.lines[li].star = !n.lines[li].star; touch(n); ui.focus = null; render(); break; }
      case 'check': { var ci = +el.getAttribute('data-i'); n.lines[ci].done = !n.lines[ci].done; touch(n); ui.focus = null; render(); break; }
      case 'todo': {
        if (ui.focus && n.lines[ui.focus.i]) {
          var tl = n.lines[ui.focus.i]; tl.todo = !tl.todo; if (!tl.todo) tl.done = false; ui.todoMode = tl.todo; touch(n); render();
        } else {

          else { n.lines.push(newLine(ui.ink, true)); ui.focus = { i: n.lines.length - 1, caret: 0 }; }

      }
      case 'ink': {

          else { n.lines.push(newLine(ink, false)); ui.focus = { i: n.lines.length - 1, caret: 0 }; }

      case 'untag': n.tags = n.tags.filter(function (t) { return t !== el.getAttribute('data-tag'); }); touch(n); render(); break;
      case 'sheet-tags': ui.focus = null; ui.sheet = { type: 'tags' }; render(); break;
      case 'sheet-talk': ui.focus = null; ui.sheet = { type: 'talk' }; render(); break;
      case 'ask-delete': ui.focus = null; ui.sheet = { type: 'delete' }; render(); break;

  }

        var parts = t.value.split('\n'), base = n.lines[i];
        base.text = parts[0];
        var extra = parts.slice(1).map(function (p) { var l = newLine(base.ink, base.todo); l.text = p; return l; });
        n.lines.splice.apply(n.lines, [i + 1, 0].concat(extra));
        ui.focus = { i: i + extra.length, caret: extra[extra.length - 1].text.length };
        touch(n); render(); return;
      }
      n.lines[i].text = t.value; ui.focus = { i: i, caret: null };
      autosize(t); touch(n);
      if (lastKb > 80) keepCaretVisible();
    }
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (e.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); return; }
    if (!(t.matches && t.matches('.ln textarea'))) return;
    var n = curNote(), i = +t.getAttribute('data-i'), l = n.lines[i];
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (l.todo && !l.text.trim()) { l.todo = false; ui.todoMode = false; ui.focus = { i: i, caret: 0 }; touch(n); render(); return; }
      var pos = t.selectionStart, rest = l.text.slice(pos);
      l.text = l.text.slice(0, pos);
      var nl = newLine(l.ink, l.todo); nl.text = rest;
      n.lines.splice(i + 1, 0, nl);
      ui.focus = { i: i + 1, caret: 0 }; touch(n); render();
    } else if (e.key === 'Backspace' && t.selectionStart === 0 && t.selectionEnd === 0 && i > 0) {
      e.preventDefault();
      var prev = n.lines[i - 1], caret = prev.text.length;
      prev.text += l.text; n.lines.splice(i, 1);
      ui.focus = { i: i - 1, caret: caret }; touch(n); render();
    }
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var form = e.target.getAttribute('data-form'), n = curNote();
    if (form === 'new-tag') {
      var v = document.getElementById('newtag').value.replace(/^#+/, '').trim().slice(0, 30);
      if (!v) return;
      var existing = data.tags.filter(function (t) { return t.toLowerCase() === v.toLowerCase(); })[0];
      var tag = existing || v;
      if (!existing) data.tags.push(tag);
      if (n.tags.indexOf(tag) < 0) n.tags.push(tag);
      touch(n); save(); ui.sheet.focus = 'newtag'; render();
    } else if (form === 'talk') {
      var title = document.getElementById('tk-title').value.trim();
      if (!title) { document.getElementById('tk-title').focus(); return; }
      setTalk(n, { title: title, speaker: document.getElementById('tk-speaker').value.trim(), url: document.getElementById('tk-url').value.trim() });
      ui.sheet = null; render();
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'import-file' && e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
  });

  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });

  // Expose pure helpers for testing only.
  window.__sn = { data: function () { return data; }, matches: matches, isStarred: isStarred, openTodos: openTodos, ui: ui };

  render();
})();

</script>

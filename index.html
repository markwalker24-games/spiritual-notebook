  function renderSettings() {
    var h = '<div class="ed-bar" style="background: var(--bg)"><button class="text-btn" data-act="home">' + ICON.back + 'Notebook</button></div><div class="set-page">';
    h += '<section class="panel"><h2>Your notes are private</h2><p class="note-p">Notes are saved only on this phone. Nobody else can see them, including your quorum presidency. If you lose or replace your phone, you need a backup to get them back.</p>' +
      '<p class="note-p">Add this app to your Home Screen. On iPhone, notes in a browser tab can be cleared after a few weeks without use; the Home Screen app keeps them.</p>' +
      (storageOk ? '' : '<p class="note-p danger">This browser is not letting the app save. Leave private browsing mode or add the app to your Home Screen.</p>') + '</section>';
    h += '<section class="panel"><h2>Download your notes</h2><p class="note-p">Save all your notes as a document you can keep forever. It opens on any phone or computer, keeps your ink colors, stars and checkboxes, and can be opened in Google Docs or Word.</p>' +
      '<div class="row"><button class="primary" data-act="export-doc">Download notes</button></div>' +
      '<p class="note-p">To put it in Google Docs: save it to Google Drive, open it there, and choose Open with › Google Docs.</p></section>';
    h += '<section class="panel"><h2>Backup</h2><p class="note-p">' + data.notes.length + ' notes. A backup file lets you restore your notes into this app on a new phone. Save one now and then, and keep it somewhere safe like your email or cloud drive.</p>' +
      '<div class="row" style="flex-wrap:wrap"><button class="primary" data-act="export">Save backup</button><label class="secondary" for="import-file" style="display:flex; align-items:center; cursor:pointer">Restore from backup</label>' +
      '<input id="import-file" type="file" accept="application/json,.json" class="sr"></div></section>';
    h += '<section class="panel"><h2>Tags</h2>';
    if (!data.tags.length) h += '<p class="note-p">No tags yet. Add one from any note.</p>';
    data.tags.forEach(function (t) {
      var count = data.notes.filter(function (n) { return n.tags.indexOf(t) >= 0; }).length;
      h += '<div class="trow"><span>#' + esc(t) + '</span><small style="color: var(--muted)">' + count + '</small><button class="text-btn danger" data-act="ask-del-tag" data-tag="' + esc(t) + '">Remove</button></div>';
    });
    h += '</section></div>';
    return h;
  }

  // ---------- Backup ----------
  function todayStamp() {
    var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  // Phones get the share sheet (Save to Files, Google Drive, email…); computers get a normal download.
  function saveFile(name, content, mime, title, doneMsg) {
    var blob = new Blob([content], { type: mime });
    if (window.claude && window.claude.use) { // the preview inside Claude
      window.claude.use('downloads').then(function (dl) {
        if (!dl) { toast('Downloads work once the app is on its own website'); return; }
        dl.save({ filename: name, data: content }).then(function () { toast(doneMsg); }, function () {});
      });
      return;
    }
    try {
      var file = new File([blob], name, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: title }).catch(function () {});
        return;
      }
    } catch (e) {}
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast(doneMsg);
  }
  function exportBackup() {
    saveFile('eq-notebook-backup-' + todayStamp() + '.json', JSON.stringify(data, null, 2), 'application/json', 'Notebook backup', 'Backup saved');
  }

  // A readable copy of every note, oldest first, that opens in any browser, Word or Google Docs.
  // Inline styles only, so the ink colors survive conversion to a Google Doc.
  var DOC_INK = { black: '#1C1C1C', blue: '#1F5FBF', red: '#C0392B', green: '#2E7D4F' };
  function notesDocument() {
    var notes = data.notes.filter(function (n) { return !isBlank(n); }).sort(function (a, b) { return a.created - b.created; });
    var out = '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>My Notebook</title></head><body style="font-family: Georgia, \'Times New Roman\', serif; color: #1C1C1C; max-width: 680px; margin: 24px auto; padding: 0 16px; line-height: 1.55; font-size: 16px;">' +
      '<h1 style="font-size: 28px; margin: 0 0 4px;">My Notebook</h1>' +
      '<p style="color: #55605A; margin: 0 0 24px; font-size: 14px;">' + notes.length + (notes.length === 1 ? ' note' : ' notes') + ' · saved ' + esc(new Date().toLocaleDateString([], { year: 'numeric', month: 'long', day: 'numeric' })) +
      ' · ★ marks lines to share in quorum</p>';
    var month = '';
    notes.forEach(function (n) {
      var m = monthName(n.created);
      if (m !== month) { month = m; out += '<h2 style="font-size: 20px; margin: 32px 0 8px; border-bottom: 1px solid #DDE1DB; padding-bottom: 4px;">' + esc(m) + '</h2>'; }
      out += '<h3 style="font-size: 16px; margin: 20px 0 4px;">' + (n.star ? '★ ' : '') + esc(fmtLong(n.created)) + ' <span style="font-weight: normal; color: #55605A;">· ' + esc(fmtTime(n.created)) + '</span></h3>';
      var meta = [];
      if (n.talk) meta.push('Talk: ' + (n.talk.url ? '<a href="' + esc(n.talk.url) + '" style="color: #1F4D3A;">' + esc(n.talk.title) + '</a>' : esc(n.talk.title)) + (n.talk.speaker ? ', ' + esc(n.talk.speaker) : ''));
      if (n.tags.length) meta.push(n.tags.map(function (t) { return '#' + esc(t); }).join(' '));
      if (meta.length) out += '<p style="margin: 0 0 6px; color: #55605A; font-size: 14px;">' + meta.join(' · ') + '</p>';
      n.lines.forEach(function (l) {
        if (!l.text.trim()) return;
        var pre = (l.todo ? (l.done ? '☑ ' : '☐ ') : '') + (l.star ? '★ ' : '');
        var style = 'margin: 0 0 4px; color: ' + (DOC_INK[l.ink] || DOC_INK.black) + ';' +
          (l.star ? ' background: #FFF4D6;' : '') + (l.todo && l.done ? ' text-decoration: line-through;' : '');
        out += '<p style="' + style + '">' + esc(pre + l.text) + '</p>';
      });
    });
    if (!notes.length) out += '<p>No notes yet.</p>';
    return out + '</body></html>';
  }
  function exportDocument() {
    saveFile('My Notebook ' + todayStamp() + '.html', notesDocument(), 'text/html', 'My Notebook', 'Notes downloaded');
  }
  function importBackup(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.notes)) throw new Error('bad');
        var have = {}; data.notes.forEach(function (n) { have[n.id] = n; });
        var added = 0;
        d.notes.forEach(function (n) {
          if (!n || !n.id || !Array.isArray(n.lines)) return;
          n.tags = Array.isArray(n.tags) ? n.tags : [];
          if (!have[n.id]) { data.notes.push(n); added++; }
          else if ((n.updated || 0) > (have[n.id].updated || 0)) { Object.assign(have[n.id], n); }
        });
        (d.tags || []).forEach(function (t) { if (data.tags.indexOf(t) < 0) data.tags.push(t); });
        data.notes.forEach(function (n) { n.tags.forEach(function (t) { if (data.tags.indexOf(t) < 0) data.tags.push(t); }); });
        save(); render();
        toast(added ? 'Restored ' + added + (added === 1 ? ' note' : ' notes') : 'Backup restored, nothing new to add');
      } catch (e) { toast('That file is not a notebook backup'); }
    };
    r.readAsText(file);
  }
  function toast(msg) {
    ui.toast = msg; renderToast();
    clearTimeout(toast.t); toast.t = setTimeout(function () { ui.toast = null; renderToast(); }, 2600);
  }
  function renderToast() {
    var el = document.getElementById('toast');
    if (!el) return;
    el.hidden = !ui.toast; el.textContent = ui.toast || '';
  }

  // ---------- Presidency module ----------
  var EQ = window.EQP ? window.EQP({ esc: esc, ICON: ICON, toast: toast, ui: ui, render: function () { render(); } }) : null;

  // ---------- Render ----------
  var app = document.getElementById('app');
  var sheetRoot = document.getElementById('sheet-root');
  function render() {
    document.body.classList.toggle('editor-page', ui.view === 'edit');
    if (ui.view !== 'edit' || ui.editingDateFor !== ui.editId) { ui.editingDate = ui.view === 'edit' && ui.editingDateFor === ui.editId && ui.editingDate; }
    ui.editingDateFor = ui.editId;
    if (ui.view === 'class') ui.sundayNew = false;
    var tabbed = ui.view === 'home' || ui.view === 'class' || ui.view === 'pres';
    document.body.classList.toggle('has-nav', tabbed);
    app.innerHTML = (ui.view === 'edit' ? renderEditor() : ui.view === 'settings' ? renderSettings()
      : ui.view === 'class' ? renderClass() : ui.view === 'pres' ? (EQ ? EQ.render() : '') : renderHome()) + (tabbed ? renderNav() : '');
    sheetRoot.innerHTML = renderSheet();
    if (ui.view === 'edit') {
      app.querySelectorAll('.ln textarea').forEach(autosize);
      if (ui.focus) focusLine(ui.focus.i, ui.focus.caret);
      placeTools();
      if (ui.highlight) {
        var hn = curNote(), hi = -1;
        hn.lines.forEach(function (l, i) { if (l.id === ui.highlight) hi = i; });
        var row = hi >= 0 && document.getElementById('ln' + hi);
        if (row) {
          row = row.closest('.ln'); row.classList.add('flash');
          try { row.scrollIntoView({ block: 'center' }); } catch (e) {}
        }
        ui.highlight = null;
      }
    }
    if (ui.sheet && ui.sheet.focus) { var f = document.getElementById(ui.sheet.focus); if (f) f.focus(); ui.sheet.focus = null; }
  }

  // ---------- Events ----------
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'scrim' && e.target !== el) return; // clicks inside the sheet
    var n = curNote();
    switch (act) {
      case 'search': ui.searching = !ui.searching; if (!ui.searching) ui.query = ''; render(); if (ui.searching) { var q = document.getElementById('q'); if (q) q.focus(); } break;
      case 'settings': ui.view = 'settings'; render(); window.scrollTo(0, 0); break;
      case 'home': ui.view = 'home'; render(); break;
      case 'filter-all': ui.filter = null; render(); break;
      case 'filter-star': setFilter('star', 1); render(); break;
      case 'filter-todo': setFilter('todo', 1); render(); break;
      case 'filter-ink': setFilter('ink', el.getAttribute('data-ink')); render(); break;
      case 'filter-tag': e.stopPropagation(); setFilter('tag', el.getAttribute('data-tag')); ui.view = 'home'; render(); break;
      case 'filter-talk': e.stopPropagation(); setFilter('talk', el.getAttribute('data-key')); render(); break;
      case 'month': var k = el.getAttribute('data-key'); ui.openMonths[k] = !ui.openMonths[k]; render(); break;
      case 'card-check': {
        e.stopPropagation();
        var cn = byId(el.getAttribute('data-id'));
        var cl = cn && cn.lines.filter(function (l) { return l.id === el.getAttribute('data-line'); })[0];
        if (cl) { cl.done = !cl.done; touch(cn); save(); render(); }
        break;
      }
      case 'open': openEditor(el.getAttribute('data-id')); break;
      case 'open-line': ui.highlight = el.getAttribute('data-line'); openEditor(el.getAttribute('data-id')); break;
      case 'row-star': {
        e.stopPropagation();
        var sn = byId(el.getAttribute('data-id'));
        var sl = sn && sn.lines.filter(function (l) { return l.id === el.getAttribute('data-line'); })[0];
        if (sl) {
          sl.star = !sl.star;
          // Unstarring a line from a starred note also unstars the note, so the line leaves the list.
          if (!sl.star && sn.star) sn.star = false;
          touch(sn); save(); render();
        }
        break;
      }
      case 'tap-below': {
        var last = n.lines[n.lines.length - 1];
        if (last && !last.text.trim()) { last.ink = ui.ink; ui.focus = { i: n.lines.length - 1, caret: 0 }; }
        else { n.lines.push(newLine(ui.ink, false)); ui.focus = { i: n.lines.length - 1, caret: 0 }; }
        touch(n); render();
        break;
      }
      case 'new': {
        var nn = { id: uid(), created: Date.now(), updated: Date.now(), star: false, tags: [], talk: null, lines: [newLine(ui.ink, false)] };
        data.notes.push(nn); ui.view = 'edit'; ui.editId = nn.id; ui.focus = { i: 0, caret: 0 }; ui.sheet = null;
        render(); window.scrollTo(0, 0); break;
      }
      case 'edit-date': {
        ui.editingDate = true; ui.focus = null; render();
        var wi = document.getElementById('note-when');
        if (wi) { wi.focus(); try { if (wi.showPicker) wi.showPicker(); } catch (er) {} }
        break;
      }
      case 'date-done': ui.editingDate = false; render(); break;
      case 'sun-toggle': {
        var wasClosed = data.sundayCollapsed === sundayHash();
        data.sundayCollapsed = wasClosed ? null : sundayHash();
        ui.sundayNew = false; save(); render();
        var hb = document.querySelector('.sun-head'); if (hb) hb.focus();
        break;
      }
      case 'ponder': {
        // Start a private note with the question as its first line, linked to Sunday's talk.
        var s = sunday(), q = s && s.questions[+el.getAttribute('data-q')];
        if (!q) break;
        var first = newLine('blue', false); first.text = q;
        var pn = { id: uid(), created: Date.now(), updated: Date.now(), star: false, tags: [], talk: null, lines: [first, newLine(ui.ink, false)] };
        if (s.title) pn.talk = { title: s.title, speaker: s.speaker, url: s.url };
        data.notes.push(pn); save();
        ui.view = 'edit'; ui.editId = pn.id; ui.focus = { i: 1, caret: 0 }; ui.sheet = null; ui.sundayNew = false;
        render(); window.scrollTo(0, 0); break;
      }
      case 'close': closeEditor(); break;
      case 'note-star': n.star = !n.star; touch(n); render(); break;
      case 'line-star': { var li = +el.getAttribute('data-i'); n.lines[li].star = !n.lines[li].star; touch(n); ui.focus = null; render(); break; }
      case 'check': { var ci = +el.getAttribute('data-i'); n.lines[ci].done = !n.lines[ci].done; touch(n); ui.focus = null; render(); break; }
      case 'todo': {
        if (ui.focus && n.lines[ui.focus.i]) {
          var tl = n.lines[ui.focus.i]; tl.todo = !tl.todo; if (!tl.todo) tl.done = false; ui.todoMode = tl.todo; touch(n); render();
        } else {
          // No line focused: start a new to-do line at the end.
          var last = n.lines[n.lines.length - 1];
          if (last && !last.text.trim()) { last.todo = true; ui.focus = { i: n.lines.length - 1, caret: 0 }; }
          else { n.lines.push(newLine(ui.ink, true)); ui.focus = { i: n.lines.length - 1, caret: 0 }; }
          ui.todoMode = true; touch(n); render();
        }
        break;
      }
      case 'ink': {
        var ink = el.getAttribute('data-ink'); ui.ink = ink;
        if (ui.focus && n.lines[ui.focus.i]) { n.lines[ui.focus.i].ink = ink; touch(n); render(); }
        else {
          var lastL = n.lines[n.lines.length - 1];
          if (lastL && !lastL.text.trim()) { lastL.ink = ink; ui.focus = { i: n.lines.length - 1, caret: 0 }; }
          else { n.lines.push(newLine(ink, false)); ui.focus = { i: n.lines.length - 1, caret: 0 }; }
          touch(n); render();
        }
        break;
      }
      case 'untag': n.tags = n.tags.filter(function (t) { return t !== el.getAttribute('data-tag'); }); touch(n); render(); break;
      case 'sheet-tags': ui.focus = null; ui.sheet = { type: 'tags' }; render(); break;
      case 'sheet-talk': ui.focus = null; ui.sheet = { type: 'talk' }; render(); break;
      case 'ask-delete': ui.focus = null; ui.sheet = { type: 'delete' }; render(); break;
      case 'ask-del-tag': ui.sheet = { type: 'del-tag', tag: el.getAttribute('data-tag') }; render(); break;
      case 'scrim': case 'sheet-close': ui.sheet = null; render(); break;
      case 'toggle-tag': {
        var tg = el.getAttribute('data-tag'), at = n.tags.indexOf(tg);
        if (at >= 0) n.tags.splice(at, 1); else n.tags.push(tg);
        touch(n); render(); break;
      }
      case 'pick-talk': {
        try { var t = JSON.parse(el.getAttribute('data-talk')); setTalk(n, t); } catch (err) {}
        ui.sheet = null; render(); break;
      }
      case 'unlink-talk': n.talk = null; touch(n); ui.sheet = null; render(); break;
      case 'delete': data.notes = data.notes.filter(function (x) { return x.id !== n.id; }); save(); ui.sheet = null; ui.view = 'home'; ui.editId = null; render(); toast('Note deleted'); break;
      case 'del-tag': {
        var dt = el.getAttribute('data-tag');
        data.tags = data.tags.filter(function (t) { return t !== dt; });
        data.notes.forEach(function (x) { x.tags = x.tags.filter(function (t) { return t !== dt; }); });
        if (sameFilter('tag', dt)) ui.filter = null;
        save(); ui.sheet = null; render(); break;
      }
      case 'export': exportBackup(); break;
      case 'export-doc': exportDocument(); break;
      case 'nav': ui.view = el.getAttribute('data-view'); ui.sheet = null; render(); window.scrollTo(0, 0); break;
      default: if (EQ) EQ.onClick(act, el, e);
    }
  });

  function setTalk(n, t) {
    var clean = { title: String(t.title || '').slice(0, 140), speaker: String(t.speaker || '').slice(0, 80), url: /^https:\/\//i.test(t.url || '') ? String(t.url).slice(0, 500) : '' };
    if (!clean.title) return;
    n.talk = clean; touch(n);
    data.recentTalks = [clean].concat(data.recentTalks.filter(function (x) { return talkKey(x) !== talkKey(clean); })).slice(0, 8);
    save();
  }

  // Keep the keyboard up while tapping the ink and to-do buttons.
  document.addEventListener('pointerdown', function (e) {
    if (e.target.closest('[data-tools]')) e.preventDefault();
  });

  document.addEventListener('focusin', function (e) {
    var ta = e.target;
    if (ta.matches && ta.matches('.ln textarea')) {
      ui.focus = { i: +ta.getAttribute('data-i'), caret: null };
      updateToolbar();
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (EQ && EQ.onInput(e)) return;
    if (t.id === 'q') { ui.query = t.value; var pos = t.selectionStart; render(); var q = document.getElementById('q'); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (er) {} } return; }
    if (t.matches && t.matches('.ln textarea')) {
      var n = curNote(), i = +t.getAttribute('data-i');
      if (!n || !n.lines[i]) return;
      if (t.value.indexOf('\n') >= 0) {
        // Pasted or typed line breaks become separate lines.
        var parts = t.value.split('\n'), base = n.lines[i];
        base.text = parts[0];
        var extra = parts.slice(1).map(function (p) { var l = newLine(base.ink, base.todo); l.text = p; return l; });
        n.lines.splice.apply(n.lines, [i + 1, 0].concat(extra));
        ui.focus = { i: i + extra.length, caret: extra[extra.length - 1].text.length };
        touch(n); render(); return;
      }
      n.lines[i].text = t.value; ui.focus = { i: i, caret: null };
      autosize(t); touch(n);
      if (lastKb > 80) keepCaretVisible();
    }
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (e.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); return; }
    if (EQ && EQ.onKey && EQ.onKey(e)) return;
    if (!(t.matches && t.matches('.ln textarea'))) return;
    var n = curNote(), i = +t.getAttribute('data-i'), l = n.lines[i];
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (l.todo && !l.text.trim()) { l.todo = false; ui.todoMode = false; ui.focus = { i: i, caret: 0 }; touch(n); render(); return; }
      var pos = t.selectionStart, rest = l.text.slice(pos);
      l.text = l.text.slice(0, pos);
      var nl = newLine(l.ink, l.todo); nl.text = rest;
      n.lines.splice(i + 1, 0, nl);
      ui.focus = { i: i + 1, caret: 0 }; touch(n); render();
    } else if (e.key === 'Backspace' && t.selectionStart === 0 && t.selectionEnd === 0 && i > 0) {
      e.preventDefault();
      var prev = n.lines[i - 1], caret = prev.text.length;
      prev.text += l.text; n.lines.splice(i, 1);
      ui.focus = { i: i - 1, caret: caret }; touch(n); render();
    }
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var form = e.target.getAttribute('data-form'), n = curNote();
    if (form && form.indexOf('p-') === 0) { if (EQ) EQ.onSubmit(form, e.target); return; }
    if (form === 'new-tag') {
      var v = document.getElementById('newtag').value.replace(/^#+/, '').trim().slice(0, 30);
      if (!v) return;
      var existing = data.tags.filter(function (t) { return t.toLowerCase() === v.toLowerCase(); })[0];
      var tag = existing || v;
      if (!existing) data.tags.push(tag);
      if (n.tags.indexOf(tag) < 0) n.tags.push(tag);
      touch(n); save(); ui.sheet.focus = 'newtag'; render();
    } else if (form === 'talk') {
      var title = document.getElementById('tk-title').value.trim();
      if (!title) { document.getElementById('tk-title').focus(); return; }
      setTalk(n, { title: title, speaker: document.getElementById('tk-speaker').value.trim(), url: document.getElementById('tk-url').value.trim() });
      ui.sheet = null; render();
    }
  });

  document.addEventListener('change', function (e) {
    if (EQ && EQ.onChange(e)) return;
    if (e.target.id === 'note-when') {
      var n = curNote(), v = e.target.value;
      var t = v ? new Date(v).getTime() : NaN;
      if (n && !isNaN(t)) { n.created = t; touch(n); save(); }
      return;
    }
    if (e.target.id === 'import-file' && e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
  });

  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });

  // Expose pure helpers for testing only.
  window.__sn = { eq: function () { return EQ; }, data: function () { return data; }, notesDocument: notesDocument, matches: matches, isStarred: isStarred, openTodos: openTodos, ui: ui };

  render();
})();

</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
